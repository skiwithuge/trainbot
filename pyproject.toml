[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainbot"
version = "0.1.0"
description = "SNCF Telegram Bot for Antibes - Nice Ville TER commute updates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
trainbot = "trainbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
